  --grain-light:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .85  0 0 0 0 .92  0 0 0 0 1  0 0 0 .22 -.04'/></filter><rect width='240' height='240' filter='url(%23g)'/></svg>");
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background-color:var(--night);
  background-image:var(--grain-light);
  color:var(--ink);
  font-family:var(--serif);
  font-size:18px;
}
[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.desk{
  min-height:100vh;
  padding:clamp(14px,4vw,48px) clamp(10px,3vw,24px) 56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* ---------- открытка ---------- */
.card{
  position:relative;
  width:100%;max-width:780px;
  padding:clamp(34px,5.5vw,58px) clamp(22px,5.5vw,64px) clamp(30px,5vw,50px);
  background-color:var(--paper);
  background-image:var(--grain-dark);
  border-radius:3px;
  overflow:hidden;overflow:clip;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 2px 3px rgba(18,24,40,.4),0 22px 40px -14px rgba(14,20,34,.6);
  animation:fade .18s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.frame{
  position:absolute;inset:11px;
  border:3px solid var(--ink);border-radius:2px;
  pointer-events:none;
  filter:url(#wobble);
}
.frame::after{content:"";position:absolute;inset:5px;border:1.5px solid var(--ink);opacity:.7}

/* ---------- старт ---------- */
.start{text-align:center;transform:rotate(-.5deg)}
.start.land{animation:land .7s cubic-bezier(.2,.8,.25,1) both}
@keyframes land{from{opacity:0;transform:translateY(-22px) rotate(-2.4deg)}to{opacity:1;transform:rotate(-.5deg)}}
.scene{display:block;width:100%;max-width:620px;height:auto;margin:0 auto 1.5rem}
.title{
  margin:0 0 1rem;
  font:400 clamp(2.1rem,7.2vw,3.4rem)/1.1 var(--hand);
  text-wrap:balance;
}
.lead{margin:0 auto 1.9rem;max-width:29rem;font-size:clamp(1.02rem,2.6vw,1.2rem);line-height:1.55;text-wrap:pretty}

/* ---------- вопросы ---------- */
.ask-grid{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:1.5rem;align-items:start}
.q{margin:.1rem 0 0;font:400 clamp(1.75rem,5vw,2.45rem)/1.18 var(--hand);text-wrap:balance}
.answers{list-style:none;margin:1.5rem 0 0;padding:0}
.answer{
  display:flex;gap:.9rem;align-items:flex-start;
  width:100%;margin:0;padding:.85rem .5rem .85rem .35rem;
  font:inherit;font-size:clamp(1.02rem,2.4vw,1.16rem);line-height:1.4;text-align:left;color:var(--ink);
  background:transparent;border:0;border-bottom:1.5px solid rgba(38,40,58,.35);
  border-radius:6px 6px 0 0;cursor:pointer;
  transition:background-color .15s;
}
.answer:hover{background:rgba(217,164,65,.24)}
.answer.is-picked{background:rgba(217,164,65,.4)}
.ring{flex:none;position:relative;width:1.35rem;height:1.35rem;margin-top:.1rem;border:2px solid var(--ink);border-radius:50%;filter:url(#wobble3);transition:background-color .15s}
.answer:hover .ring{background:var(--ochre-wash)}
.answer.is-picked .ring{background:var(--ochre)}
.answer.is-picked .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}

.link{
  display:inline-block;margin:1.4rem 0 0;padding:.2rem .1rem;
  font:400 1.2rem/1.2 var(--hand);color:var(--ink-soft);
  background:none;border:0;cursor:pointer;
  text-decoration:underline wavy rgba(143,58,75,.7) 1.4px;text-underline-offset:5px;
}
.link:hover{color:var(--ink)}

/* ---------- марка и штемпель ---------- */
.franking{--s:1;position:relative;width:calc(150px*var(--s));height:calc(152px*var(--s));justify-self:end;flex:none}
.franking-inner{position:absolute;right:0;top:0;width:150px;height:152px;transform:scale(var(--s));transform-origin:100% 0}
.stamp{position:absolute;right:0;top:0;width:88px;height:106px;transform:rotate(3deg);filter:drop-shadow(0 2px 2px rgba(38,40,58,.38))}
.pm{position:absolute;left:-35px;top:30px;width:175px;height:122px;transform:rotate(-9deg);transform-origin:61px 61px;mix-blend-mode:multiply;opacity:.9}
.result .pm{animation:thump .55s cubic-bezier(.2,.8,.2,1) .25s both}
@keyframes thump{
  from{opacity:0;transform:scale(1.8) rotate(-24deg)}
  55%{opacity:.95;transform:scale(.94) rotate(-7deg)}
  to{opacity:.9;transform:scale(1) rotate(-9deg)}
}

/* ---------- результат ---------- */
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.hello{margin:.5rem 0 0;font:400 clamp(1.6rem,4.6vw,2.1rem)/1.1 var(--hand)}
.quote{
  margin:.9rem 0 .6rem;
  font:italic 400 clamp(1.6rem,4.6vw,2.4rem)/1.26 var(--serif);
  text-align:center;text-wrap:balance;
}
.quote.is-long{font-size:clamp(1.3rem,3.7vw,1.85rem)}
.source{margin:0 0 1.1rem;font:400 clamp(1.2rem,3.2vw,1.45rem)/1.3 var(--hand);color:var(--ink-soft);text-align:center}
.swash{display:block;margin:0 auto 1.2rem}
.prediction{margin:0 auto;max-width:34rem;font:400 clamp(1.4rem,3.8vw,1.8rem)/1.5 var(--hand);text-align:center;text-wrap:pretty}
.picture{
  position:relative;
  width:min(100%,560px);margin:2.1rem auto 1.9rem;padding:10px;
  background:var(--paper-2);border:2px solid var(--ink);
  transform:rotate(-.6deg);
  box-shadow:0 8px 14px -8px rgba(38,40,58,.5);
}
.picture img{display:block;width:100%;height:auto}
.picture::before,.picture::after{content:"";position:absolute;top:-13px;width:66px;height:22px;background:rgba(217,164,65,.6);mix-blend-mode:multiply}
.picture::before{left:-16px;transform:rotate(-35deg)}
.picture::after{right:-16px;transform:rotate(35deg)}
.ph{
  display:grid;place-items:center;aspect-ratio:4/3;padding:1.5rem;text-align:center;
  border:2px dashed rgba(38,40,58,.5);
  font:400 1.35rem/1.3 var(--hand);color:var(--ink-soft);
}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem 1.1rem}
.btn{
  margin:0;padding:.7rem 1.5rem .75rem;
  font:400 1.4rem/1.1 var(--hand);color:var(--ink);
  background:var(--paper-2);border:2px solid var(--ink);
  border-radius:14px 6px 16px 5px/7px 15px 6px 14px;
  box-shadow:3px 3px 0 var(--ink);cursor:pointer;
  transition:transform .12s,box-shadow .12s,background-color .12s;
}
.btn:hover{background:var(--ochre-wash)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-primary{background:var(--ochre)}
.btn-primary:hover{background:#E4B556}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none;background:var(--paper-2)}
.status{min-height:1.5em;margin:.9rem 0 0;font:400 1.2rem/1.3 var(--hand);color:var(--ink-soft);text-align:center}
.status.is-error{color:var(--berry)}
.again{display:block;margin:.4rem auto 0}

noscript{display:block;max-width:30rem;margin:2rem auto;padding:1.2rem;background:var(--paper);text-align:center}

@media (max-width:620px){
  .ask-grid{grid-template-columns:1fr;gap:.2rem}
  .ask-grid .franking{--s:.66;order:-1}
  .topline .franking{--s:.74}
  .actions .btn{flex:1 1 100%}
  .frame{inset:8px}
  .picture::before{left:-8px}
  .picture::after{right:-8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

  /* ---------- открытка целиком: рисуем на canvas ---------- */

    edge(x, y, x + w, y); edge(x + w, y, x + w, y + h); edge(x + w, y + h, x, y + h); edge(x, y + h, x, y);

  function renderPostcard(n, imgEl) {

      var swY = y + 12; y += 46;

        ctx.setLineDash([12, 9]); ctx.strokeStyle = 'rgba(38,40,58,.5)'; ctx.lineWidth = 3;
        ctx.strokeRect(mx + 20, picTop + 20, innerW, innerH); ctx.setLineDash([]);
        lines(['Здесь появится иллюстрация:', 'файл quote_' + n + '.png'], W / 2, picTop + 20 + innerH / 2 - 56, 56, FH(42), C.soft);
      }
      ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(217,164,65,.62)';
      ctx.save(); ctx.translate(mx - 4, picTop + 2); ctx.rotate(-35 * Math.PI / 180); ctx.fillRect(-34, -12, 68, 24); ctx.restore();
      ctx.save(); ctx.translate(mx + matW + 4, picTop + 2); ctx.rotate(35 * Math.PI / 180); ctx.fillRect(-34, -12, 68, 24); ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();

      lines([foot], W / 2, fTop, 44, FH(32), C.soft);

      return new Promise(function (resolve, reject) {
        try {
          canvas.toBlob(function (b) { b ? resolve(b) : reject(new Error('toBlob вернул пустой результат')); }, 'image/png');
        } catch (e) { reject(e); }
      });
    });
  }

  /* ---------- события и запуск ---------- */
  app.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t || t.disabled) return;
    if (t.dataset.answer !== undefined) { if (!locked) choose(+t.dataset.answer, t); return; }
    switch (t.dataset.action) {
      case 'start':      state.step = 0; state.answers = []; showAsk(); break;
      case 'back':       state.step = Math.max(0, state.step - 1); showAsk(); break;
      case 'restart':    restart(); break;
      case 'save-image': saveImage(); break;
      case 'save-card':  savePostcard(t); break;
    }
  });

  window.PostcardQuiz = { pickQuote: pickQuote, QUOTES: QUOTES, QUESTIONS: QUESTIONS };

  var m0 = location.hash.match(/^#result-(\d{1,2})$/);
  if (m0 && QUOTES[+m0[1]]) showResult(+m0[1]); else showStart(true);
})();
</script>
